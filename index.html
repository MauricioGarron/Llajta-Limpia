<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Login EMSA</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="login-container">

    <h1>Login EMSA</h1>

    <form id="login-form">

      <label>Correo</label>

      <input
        type="email"
        id="correo"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        required
      >

      <button type="submit">
        Ingresar
      </button>
      <br />

<a href="recover-password.html">
  ¿Olvidaste tu contraseña?
</a>

    </form>

    <p id="mensaje-login"></p>

    <a href="register.html">
      Registrarse
    </a>

  </div>

  <script
    type="module"
    src="./src/login.js">
  </script>

</body>

</html>
