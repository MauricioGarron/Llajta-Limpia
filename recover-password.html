<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <title>
    Recuperar contraseña
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

  <h1>
    Recuperar contraseña
  </h1>

  <form id="recover-form">

    <label>
      Correo:
    </label>

    <input
      type="email"
      id="correo"
      required
    />

    <label>
      Nueva contraseña:
    </label>

    <input
      type="password"
      id="nueva-password"
      required
    />

    <button type="submit">
      Actualizar contraseña
    </button>

  </form>

  <div id="mensaje"></div>

  <br />

  <a href="index.html">
    Volver al login
  </a>

  <script
    type="module"
    src="./src/login-emsa/recover-password-ui.js">
  </script>

</body>

</html>
