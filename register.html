<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Registro EMSA</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="login-container">

    <h1>Registro EMSA</h1>

    <form id="register-form">

      <label>Nombre</label>

      <input
        type="text"
        id="nombre"
        required
      >

      <label>Correo</label>

      <input
        type="email"
        id="correo"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        required
      >

      <button type="submit">
        Crear cuenta
      </button>

    </form>

    <p id="mensaje-registro"></p>

    <a href="index.html">
      Volver al login
    </a>

  </div>

  <script
    type="module"
    src="./src/register.js">
  </script>

</body>

</html>
